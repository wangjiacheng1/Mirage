# =============================================================================
# Gradle Wrapper —— 构建工具版本锁
# =============================================================================
#
# 🔴 这个文件必须入库，而且版本必须手动钉死。
#
# 教训（2026-10-19 首次 Sync 失败）：
#   最初的骨架漏了 wrapper，Android Studio 于是自作主张从本地缓存里挑了
#   gradle-9.0-milestone-1（一个预览版），结果 Sync 直接炸：
#     "Cannot select root node 'debugRuntimeClasspathCopy' as a variant"
#   根因是 Gradle 9 新增了「一个 configuration 不能同时当解析根和变体」的
#   校验，而 AGP 8.7.3 给 IDE 提供模型时正好违反它。
#   → 没有 wrapper = 把构建工具版本的决定权交给 IDE 的运气。绝不允许。
#
# 为什么是 8.9（三方约束的唯一交集，改任何一个都要重算这张表）：
#
#   AGP 8.7.3      要求 Gradle >= 8.9，且不支持 9.x
#   Kotlin 2.1.0   支持 Gradle 7.6.3 ~ 8.10，不支持 9.x
#   Android Studio 自带 JBR 21，要求 Gradle >= 8.5
#   ------------------------------------------------------------------
#   交集 = [8.9, 8.10]，取下界 8.9（AGP 官方搭配版本，踩坑概率最低）
#
# 为什么用 -all 而不是 -bin：
#   -all 带 Gradle 源码和文档，IDE 里点进 Gradle DSL 能看到源码和注释。
#   代价是多下几十 MB。对「跟着注释学」的开发节奏，这个代价值得。
#   （本机 ~/.gradle/wrapper/dists/ 已有 gradle-8.9-all 缓存，实际零下载）
#
# 什么时候才改这个版本号：
#   只有在升级 AGP 或 Kotlin 时，先查官方兼容矩阵重算交集，再一起改。
#   绝不接受 Android Studio 弹窗「有新版 Gradle，是否升级？」的单独升级。
# =============================================================================

distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-all.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
