# =============================================================================
# Gradle / Kotlin 构建配置
# =============================================================================

# JVM 堆。KMP + Compose 编译比纯 Android 吃内存，2G 容易 OOM，直接给 4G。
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# 并行构建 + 构建缓存。:shared 和 :androidApp 之间依赖简单，并行收益明显。
org.gradle.parallel=true
org.gradle.caching=true

# 配置缓存（configuration cache）：开启后第二次之后的构建能快一大截。
# 🔴 但 M1 阶段先关掉，理由：
#   它会把「配置阶段的结果」整体序列化缓存，一旦某个插件不兼容，
#   报错信息会变成一长串看不懂的序列化异常，把真正的问题盖住。
#   KMP + AGP + KSP 三者凑在一起时这种不兼容是常见的。
#   现在的首要目标是「让构建先跑通、报错要能看懂」，性能是以后的事。
# 什么时候开：M1 的 :shared:jvmTest 和 APK 都能稳定构建之后，
#   单独开一次、跑全量验证，有问题就再关掉（记入 docs/09）。
# org.gradle.configuration-cache=true

# AndroidX（非 support 库）
android.useAndroidX=true

# 关掉 BuildConfig 自动生成里不需要的部分，减少增量编译噪音
android.defaults.buildfeatures.buildconfig=false
android.nonTransitiveRClass=true

# Kotlin 代码风格，和 .editorconfig 保持一致
kotlin.code.style=official

# 注：原先这里写了 kotlin.mpp.enableCInteropCommonization=true，已删除。
# 那个开关只对 native（iOS/macOS）target 的 C 互操作有意义，
# 而我们现在只有 jvm() + androidTarget()，开着它只会多一条构建警告。
# 将来真的开 iOS target 时（docs/09 Q11）再加回来。
